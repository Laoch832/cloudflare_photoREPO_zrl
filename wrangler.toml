name = "zrlcollections"
main = "src/index.js"
compatibility_date = "2024-01-01"

# 自定义域名配置
routes = [
	{ pattern = "love.canz-monkey.cn", custom_domain = true }
]

[observability]
enabled = false

# 配置静态资源目录 (Worker Sites)
# Wrangler 会自动将 public 目录下的文件上传到 KV
[site]
bucket = "./public"


# 环境变量
[vars]
# 这里的配置对于静态站点可能用处不大，但可以保留
GALLERY_TITLE = "My Static Gallery"

# KV 命名空间
[[kv_namespaces]]
binding = "CHAT_DATA"
id = "9d7798d93e6141dc8e3d328439fcc1a2"
preview_id = "9d7798d93e6141dc8e3d328439fcc1a2" # Preview 使用相同的 ID 方便测试
