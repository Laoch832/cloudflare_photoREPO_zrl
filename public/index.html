<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub 静态图库</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; background-color: #f4f4f5; }
    h1 { text-align: center; color: #333; }
    .description { text-align: center; color: #666; margin-bottom: 30px; }
    #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    .image-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: transform 0.2s; }
    .image-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.15); }
    .image-card img { width: 100%; height: 250px; object-fit: cover; display: block; }
    .image-info { padding: 15px; }
    .image-name { font-weight: bold; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .image-date { font-size: 0.8em; color: #888; }
    .copy-btn { margin-top: 10px; display: inline-block; background: #0070f3; color: white; padding: 5px 10px; border-radius: 4px; font-size: 0.8em; cursor: pointer; text-decoration: none; }
    .copy-btn:hover { background: #0051a2; }
    .loading { text-align: center; grid-column: 1 / -1; padding: 50px; color: #666; }
  </style>
</head>
<body>
  <h1>GitHub 静态图库</h1>
  <p class="description">图片存储在 GitHub 仓库中，每次 Push 自动构建更新。</p>
  
  <div id="gallery">
    <div class="loading">正在加载图片列表...</div>
  </div>

  <script>
    async function loadGallery() {
      const gallery = document.getElementById('gallery');
      // 配置加速域名 (如果有)
      const CDN_HOST = 'love.canz-monkey.cn';
      const baseUrl = CDN_HOST ? `https://${CDN_HOST}` : window.location.origin;

      try {
        // 读取构建脚本生成的索引文件
        const response = await fetch('/images.json');
        if (!response.ok) throw new Error('Failed to load index');
        
        const images = await response.json();
        
        if (images.length === 0) {
          gallery.innerHTML = '<div class="loading">暂无图片，请在 public/images 目录下添加图片并重新部署。</div>';
          return;
        }

        gallery.innerHTML = '';
        
        images.forEach(img => {
          const div = document.createElement('div');
          div.className = 'image-card';
          // 确保 URL 是绝对路径或相对于根目录
          const fullUrl = baseUrl + img.url;
          
          div.innerHTML = `
            <a href="${fullUrl}" target="_blank"><img src="${fullUrl}" loading="lazy" alt="${img.name}"></a>
            <div class="image-info">
              <div class="image-name" title="${img.name}">${img.name}</div>
              <div class="image-date">${new Date(img.uploadedAt).toLocaleDateString()}</div>
              <div class="copy-btn" onclick="copyLink('${fullUrl}')">复制链接</div>
            </div>
          `;
          gallery.appendChild(div);
        });
      } catch (e) {
        console.error(e);
        gallery.innerHTML = '<div class="loading">加载失败，请检查 images.json 是否存在。</div>';
      }
    }

    function copyLink(url) {
      navigator.clipboard.writeText(url).then(() => {
        alert('链接已复制到剪贴板');
      });
    }

    loadGallery();
  </script>
</body>
</html>
