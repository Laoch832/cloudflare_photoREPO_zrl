<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    /* CSS Variables for Theme */
    :root {
      --bg-color: #ffffff;
      --text-color: #202124;
      --secondary-text: #5f6368;
      --nav-bg: rgba(255, 255, 255, 0.8);
      --card-bg: #f8f9fa;
      --accent-color: #1a73e8;
    }

    [data-theme="dark"] {
      --bg-color: #202124;
      --text-color: #e8eaed;
      --secondary-text: #9aa0a6;
      --nav-bg: rgba(32, 33, 36, 0.8);
      --card-bg: #292a2d;
      --accent-color: #8ab4f8;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Google Sans', 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
    }

    /* --- Navigation --- */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      justify-content: space-between;
      z-index: 100;
      background: var(--nav-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(128,128,128,0.1);
    }

    .nav-left { display: flex; align-items: center; gap: 32px; }
    
    .nav-links { display: flex; gap: 24px; }
    .nav-link {
      text-decoration: none;
      color: var(--secondary-text);
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .nav-link:hover { background: rgba(128,128,128,0.1); color: var(--text-color); }
    .nav-link.active { color: var(--accent-color); background: rgba(26, 115, 232, 0.1); }

    .nav-right { display: flex; align-items: center; gap: 16px; font-size: 14px; color: var(--secondary-text); }
    .ping-display { font-family: monospace; }
    .theme-toggle { cursor: pointer; padding: 8px; border-radius: 50%; display: flex; }
    .theme-toggle:hover { background: rgba(128,128,128,0.1); }

    /* --- Home Content --- */
    .container {
      max-width: 1200px;
      margin: 100px auto 40px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 32px;
    }

    .section-card {
      background: var(--card-bg);
      padding: 32px;
      border-radius: 16px;
      margin-bottom: 32px;
    }

    h1 { font-size: 32px; margin-bottom: 16px; font-weight: 400; }
    h2 { font-size: 20px; margin-bottom: 16px; color: var(--secondary-text); font-weight: 500; }
    p { line-height: 1.6; color: var(--secondary-text); }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .stat-item {
      background: var(--bg-color);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }
    .stat-value { font-size: 24px; font-weight: bold; color: var(--accent-color); }
    .stat-label { font-size: 14px; color: var(--secondary-text); margin-top: 4px; }

    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .feature-card {
      display: flex;
      align-items: center;
      padding: 16px;
      background: var(--bg-color);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text-color);
      transition: transform 0.2s;
    }
    .feature-card:hover { transform: translateX(5px); }
    .feature-icon { margin-right: 16px; color: var(--accent-color); }

    /* Notes Module */
    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .note-item {
      padding: 16px;
      background: var(--bg-color);
      border-radius: 12px;
      border-left: 4px solid var(--accent-color);
    }
    .note-date { font-size: 12px; color: var(--secondary-text); margin-bottom: 4px; }
    .note-content { font-size: 14px; color: var(--text-color); }

    @media (max-width: 800px) {
      .container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="top-bar">
    <div class="nav-left">
      <div class="nav-links">
        <a href="/" class="nav-link active">首页</a>
        <a href="/gallery" class="nav-link">图库</a>
      </div>
    </div>
    <div class="nav-right">
      <div class="ping-display" id="pingDisplay">Ping: --ms</div>
      <div class="theme-toggle" onclick="toggleTheme()">
        <span class="material-icons" id="themeIcon">dark_mode</span>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <!-- Left Column: Intro & Carousel Placeholder -->
    <div class="main-column">
      <div class="section-card">
        <h1>这里展示轮播图片(随机)</h1>
      </div>

      <div class="section-card">
        <h2>小笔记</h2>
        <div id="notes-container" class="notes-list">
          <div style="text-align: center; color: var(--secondary-text);">加载中...</div>
        </div>
      </div>
    </div>

    <!-- Right Column: Stats & Links -->
    <aside class="side-column">
      <div class="section-card">
        <h2>数据统计</h2>
        <div class="stat-grid">
          <div class="stat-item">
            <div class="stat-value" id="imgCount">--</div>
            <div class="stat-label">照片数量</div>
          </div>
          <div class="stat-item">
            <div class="stat-value">1</div>
            <div class="stat-label">运行天数</div>
          </div>
        </div>
      </div>

      <div class="section-card">
        <h2>功能模块</h2>
        <div class="feature-list">
          <a href="/gallery" class="feature-card">
            <span class="material-icons feature-icon">photo_library</span>
            <div>
              <div style="font-weight: 500;">图库</div>
              <div style="font-size: 12px; color: var(--secondary-text);">浏览我的摄影作品</div>
            </div>
          </a>
          <div class="feature-card" style="opacity: 0.5; cursor: default;">
            <span class="material-icons feature-icon">code</span>
            <div>
              <div style="font-weight: 500;">博客</div>
              <div style="font-size: 12px; color: var(--secondary-text);">开发中...</div>
            </div>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <script>
    // --- Common Logic (Theme & Ping) ---
    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeIcon(savedTheme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeIcon(next);
    }

    function updateThemeIcon(theme) {
      document.getElementById('themeIcon').innerText = theme === 'light' ? 'dark_mode' : 'light_mode';
    }

    function updatePing() {
      const start = performance.now();
      fetch('/cdn-cgi/trace').then(() => {
        const duration = Math.round(performance.now() - start);
        document.getElementById('pingDisplay').innerText = `Ping: ${duration}ms`;
      }).catch(() => {
        document.getElementById('pingDisplay').innerText = 'Ping: Timeout';
      });
    }

    initTheme();
    setInterval(updatePing, 30000);
    updatePing();

    // --- Stats & Notes Logic ---
    Promise.all([
      fetch('/images.json').then(res => res.json()),
      fetch('/notes.json').then(res => res.json())
    ]).then(([images, notes]) => {
      // Stats
      document.getElementById('imgCount').innerText = images.length;
      
      // Notes
      const notesContainer = document.getElementById('notes-container');
      if (notes.length === 0) {
        notesContainer.innerHTML = '<div style="text-align: center; color: var(--secondary-text);">暂无笔记</div>';
      } else {
        notesContainer.innerHTML = '';
        // Sort notes by date desc
        notes.sort((a, b) => new Date(b.date) - new Date(a.date));
        
        notes.forEach(note => {
          const item = document.createElement('div');
          item.className = 'note-item';
          item.innerHTML = `
            <div class="note-date">${new Date(note.date).toLocaleDateString()}</div>
            <div class="note-content">${note.content}</div>
          `;
          notesContainer.appendChild(item);
        });
      }
    }).catch(e => {
      console.error(e);
      document.getElementById('notes-container').innerHTML = '加载失败';
    });
  </script>
</body>
</html>
