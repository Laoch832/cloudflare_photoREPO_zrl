name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - master
  repository_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Cache Media Assets
        uses: actions/cache@v3
        with:
          path: |
            public/images/thumbnails
            public/music/hls
            public/music/covers
          key: ${{ runner.os }}-media-${{ hashFiles('assets-src/music/*', 'public/images/*') }}
          restore-keys: |
            ${{ runner.os }}-media-

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
