name: Publish encrypted media archive
on:
  workflow_dispatch:
    inputs:
      demo:
        description: Use a synthetic password-protected 7z for end-to-end testing
        type: boolean
        default: true
      work_id:
        description: One unique ID per archive; same ID updates the same Worker
        type: string
        required: true
        default: pipeline-demo
      archive_url:
        description: Direct HTTPS 7z URL, or leave blank to use MEDIA_ARCHIVE_URL Secret
        type: string
        default: ''
permissions:
  contents: read
jobs:
  publish:
    uses: Laoch832/archive-media-workers/.github/workflows/publish.yml@main
    with:
      demo: ${{ inputs.demo }}
      work_id: ${{ inputs.work_id }}
      archive_url: ${{ inputs.archive_url }}
    secrets: inherit
