name: Seal Cloudflare secrets for media repository
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install GitHub-compatible sealed-box encryption
        run: npm install --prefix "$RUNNER_TEMP/seal" --save-exact libsodium-wrappers@0.7.15
      - name: Encrypt directly to destination repository public key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_PUBLIC_KEY: sDMx3VP4qcGmoR8Wg0RC2W9lkQ64QEGKTxMenIm4vB4=
          TARGET_KEY_ID: '3380204578043523366'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sodium = require(process.env.RUNNER_TEMP + '/seal/node_modules/libsodium-wrappers');
          (async () => {
            await sodium.ready;
            const publicKey = sodium.from_base64(process.env.TARGET_PUBLIC_KEY, sodium.base64_variants.ORIGINAL);
            const sealed = {};
            for (const name of ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID']) {
              if (!process.env[name]) throw new Error('Source secret is missing: ' + name);
              const cipher = sodium.crypto_box_seal(sodium.from_string(process.env[name]), publicKey);
              sealed[name] = { key_id: process.env.TARGET_KEY_ID, encrypted_value: sodium.to_base64(cipher, sodium.base64_variants.ORIGINAL) };
            }
            fs.writeFileSync(process.env.RUNNER_TEMP + '/sealed-media-secrets.json', JSON.stringify(sealed));
            console.log('Encrypted two values for the destination repository; no plaintext exported.');
          })().catch(() => { console.error('Sealing failed'); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-media-secrets
          path: ${{ runner.temp }}/sealed-media-secrets.json
          retention-days: 1
